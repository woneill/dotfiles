".zsh/zsh-autosuggestions":
  type: "git-repo"
  url: "https://github.com/zsh-users/zsh-autosuggestions"
".vim/bundle/Vundle.vim":
  type: "git-repo"
  url: "https://github.com/VundleVim/Vundle.vim.git"
  refreshPeriod: "168h"
".local/share/gh/extensions/gh-cp":
  type: "git-repo"
  url: "https://github.com/mislav/gh-cp.git"
  refreshPeriod: "168h"
{{ if eq (get .chezmoi.osRelease "id" | default "") "qts" -}}
{{ $version := "2.42.0" }}
"bin/op":
  type: "archive-file"
  url: "https://cache.agilebits.com/dist/1P/op2/pkg/v{{ $version }}/op_linux_amd64_v{{ $version }}.zip"
  path: "op"
  executable: true
{{ end }}
